name: CI - SaludPública Connect

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: saludpublica
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install and build Backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/saludpublica?schema=public"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          JWT_SECRET: "test_secret_for_ci_build"
        run: |
          cd backend
          npm install
          npx prisma generate
          npm run build

      - name: Install and build Frontend
        run: |
          cd frontend
          npm install
          npm run build
